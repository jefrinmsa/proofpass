services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zk
      POSTGRES_PASSWORD: zk_local_demo
      POSTGRES_DB: zk_auth
    ports: ['127.0.0.1:5432:5432']
    volumes: ['zk-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zk -d zk_auth']
      interval: 5s
      retries: 10
volumes:
  zk-data:
